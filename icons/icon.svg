<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd6e8"/>
      <stop offset="1" stop-color="#cfeeff"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="256" y1="152" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5703f"/>
      <stop offset="1" stop-color="#8a5a3c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- head -->
  <circle cx="256" cy="300" r="148" fill="url(#skinGrad)"/>

  <!-- head shine -->
  <ellipse cx="200" cy="220" rx="34" ry="22" fill="#ffffff" opacity="0.18"/>

  <!-- hair tuft -->
  <path d="M 226,168 Q 234,132 268,142 Q 296,150 288,178 Q 258,158 226,168 Z" fill="#3f2a1c"/>
  <circle cx="222" cy="172" r="12" fill="#3f2a1c"/>

  <!-- blush -->
  <ellipse cx="178" cy="330" rx="24" ry="15" fill="#ff9ec7" opacity="0.55"/>
  <ellipse cx="334" cy="330" rx="24" ry="15" fill="#ff9ec7" opacity="0.55"/>

  <!-- eyes (happy closed) -->
  <path d="M 188,280 Q 204,262 222,280" fill="none" stroke="#3f2a1c" stroke-width="14" stroke-linecap="round"/>
  <path d="M 290,280 Q 308,262 324,280" fill="none" stroke="#3f2a1c" stroke-width="14" stroke-linecap="round"/>

  <!-- pacifier -->
  <circle cx="256" cy="328" r="20" fill="none" stroke="#7fe6c4" stroke-width="11"/>
  <ellipse cx="256" cy="368" rx="46" ry="34" fill="#d6fff0" stroke="#7fe6c4" stroke-width="7"/>
  <circle cx="256" cy="368" r="9" fill="#7fe6c4" opacity="0.7"/>
</svg>
